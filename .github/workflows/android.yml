name: Build Tasneem Android APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: tasneem-v12-work
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Check JavaScript
        run: npm run check
      - name: Validate bundled Quran and Mushaf assets
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          q=json.loads(Path('data/quran.json').read_text(encoding='utf-8'))
          assert isinstance(q,list) and len(q)==6236, f'Expected 6236 ayahs, got {len(q)}'
          assert len({x.get('surah') for x in q})==114, 'Expected 114 surahs'
          assert [(x.get('surah'),x.get('ayah')) for x in q[:3]] == [(1,1),(1,2),(1,3)]
          pages=sorted(Path('mushaf/pages').glob('page-*.jpg'))
          assert len(pages)==604, f'Expected 604 mushaf pages, got {len(pages)}'
          assert Path('native-res/raw/adhan.mp3').stat().st_size > 10000
          print('Quran: 6236 ayahs / 114 surahs; Mushaf: 604 pages; Adhan audio: OK')
          PY
      - name: Prepare web assets
        shell: bash
        run: |
          rm -rf www
          mkdir -p www/vendor/ort www/data www/models
          command -v rsync >/dev/null 2>&1 || { echo 'rsync is required'; exit 1; }
          rsync -a --exclude='www' --exclude='android' --exclude='node_modules' --exclude='.git' --exclude='.github' --exclude='native-res' --exclude='android-native' ./ www/
          curl -L --fail --retry 3 -o www/data/page-map.json https://raw.githubusercontent.com/Mushaf-Learning/quran-text/main/metadata/pages.json
          cp node_modules/onnxruntime-web/dist/ort.min.js www/vendor/ort.min.js
          cp node_modules/onnxruntime-web/dist/ort-wasm* www/vendor/ort/ || true
          # تضمين نموذج التسميع داخل APK حتى لا يحتاج الإنترنت عند أول استخدام.
          curl -L --fail --retry 4 --retry-delay 2 -o www/models/fastconformer_full_mixed.onnx \
            https://huggingface.co/acibZ/tilawa-quran-onnx/resolve/main/fastconformer_full_mixed.onnx
          curl -L --fail --retry 4 --retry-delay 2 -o www/models/quran_ctc_tokens.json \
            https://huggingface.co/acibZ/tilawa-quran-onnx/resolve/main/quran_ctc_tokens.json
          test -s www/data/quran.json
          test -s www/data/page-map.json
          test -s www/vendor/ort.min.js
          test -d www/vendor/ort
          test -s www/models/fastconformer_full_mixed.onnx
          test -s www/models/quran_ctc_tokens.json
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Capacitor
        run: npx cap sync android
      - name: Install Tasneem native Android layer
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/tasneem/app
          cp android-native/com/tasneem/app/*.java android/app/src/main/java/com/tasneem/app/
          mkdir -p android/app/src/main/res/drawable android/app/src/main/res/raw
          cp native-res/drawable/ic_stat_mosque.xml android/app/src/main/res/drawable/ic_stat_mosque.xml
          cp native-res/raw/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
      - name: Configure Android native entry point and permissions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          perms=['android.permission.INTERNET','android.permission.ACCESS_COARSE_LOCATION','android.permission.ACCESS_FINE_LOCATION','android.permission.RECORD_AUDIO','android.permission.POST_NOTIFICATIONS','android.permission.SCHEDULE_EXACT_ALARM','android.permission.USE_EXACT_ALARM','android.permission.RECEIVE_BOOT_COMPLETED','android.permission.FOREGROUND_SERVICE','android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK','android.permission.FOREGROUND_SERVICE_SPECIAL_USE','android.permission.WAKE_LOCK']
          for perm in perms:
            if perm not in s:
              s=re.sub(r'(<manifest\b[^>]*>)', lambda m:m.group(1)+'\n    <uses-permission android:name="'+perm+'" />', s, count=1)
          app='<application'
          receiver=''.join([
            '\n        <receiver android:name=".AdhanAlarmReceiver" android:exported="false"/>',
            '\n        <receiver android:name=".AyahAlarmReceiver" android:exported="false"/>',
            '\n        <receiver android:name=".NotificationActionReceiver" android:exported="false"/>',
          '\n        <receiver android:name=".UnlockReceiver" android:exported="false"/>',
            '\n        <receiver android:name=".BootReceiver" android:exported="false"><intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/><action android:name="android.intent.action.MY_PACKAGE_REPLACED"/></intent-filter></receiver>',
          '\n        <service android:name=".PlaybackService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>',
          '\n        <service android:name=".AdhanService" android:exported="false" android:foregroundServiceType="mediaPlayback"/>',
          '\n        <service android:name=".UnlockService" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="unlock_dhikr_reminder"/></service>\n'
          ])
          if 'AdhanAlarmReceiver' not in s:
            s=s.replace('</application>', receiver+'    </application>')
          p.write_text(s)
          import xml.dom.minidom; xml.dom.minidom.parseString(s.encode())
          PY
          cat > android/app/src/main/java/com/tasneem/app/MainActivity.java <<'JAVA'
          package com.tasneem.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
            private static final int MIC_REQUEST=7301;
            @Override public void onCreate(Bundle savedInstanceState){
              registerPlugin(TasneemPlugin.class);
              super.onCreate(savedInstanceState);
              if(Build.VERSION.SDK_INT>=23 && checkSelfPermission(Manifest.permission.RECORD_AUDIO)!=PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO},MIC_REQUEST);
              if(Build.VERSION.SDK_INT>=33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED) requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7302);
            }
          }
          JAVA
      - name: Validate native sources
        run: |
          grep -q 'class TasneemPlugin' android/app/src/main/java/com/tasneem/app/TasneemPlugin.java
          grep -q 'import java.io.File' android/app/src/main/java/com/tasneem/app/AdhanService.java
          grep -q 'PlaybackService' android/app/src/main/AndroidManifest.xml
          grep -q 'STOP_ADHAN' android/app/src/main/java/com/tasneem/app/NotificationActionReceiver.java
          grep -q 'stopService' android/app/src/main/java/com/tasneem/app/NotificationActionReceiver.java
          grep -q 'SALAWAT_SILENT_CHANNEL' android/app/src/main/java/com/tasneem/app/UnlockReceiver.java
          test -s android/app/src/main/res/raw/adhan.mp3
          test -s android/app/src/main/res/drawable/ic_stat_mosque.xml
      - name: Build debug APK
        working-directory: tasneem-v12-work/android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tasneem-debug-apk
          path: tasneem-v12-work/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
