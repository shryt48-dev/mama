name: Build Android APK

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21 (required by Capacitor 7)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: npm run check

      - name: Verify required project files
        run: |
          test -f data/quran.json
          test -f native-res/raw/adhan.mp3
          test -f android-native/patch_android_project.py
          COUNT=$(ls mushaf/pages/page-*.jpg | wc -l)
          echo "Mushaf pages: $COUNT"
          test "$COUNT" -eq 604

      - name: Prepare web build folder (www)
        run: |
          rm -rf www && mkdir -p www/vendor/ort
          cp index.html manifest.webmanifest sw.js www/
          cp -r css js data icons mushaf assets www/
          # ONNX Runtime Web (used by the recitation checker) - served locally, offline
          cp node_modules/onnxruntime-web/dist/ort.min.js www/vendor/ort.min.js
          cp node_modules/onnxruntime-web/dist/ort-wasm*.wasm www/vendor/ort/
          cp node_modules/onnxruntime-web/dist/ort-wasm*.mjs www/vendor/ort/ 2>/dev/null || true
          ls -la www/vendor www/vendor/ort

      - name: Add Android platform
        run: npx cap add android

      - name: Remove default launcher icons (ours replace them)
        run: find android/app/src/main/res -name 'ic_launcher*.webp' -delete

      - name: Apply native layer (Java, sounds, manifest, MainActivity)
        run: python3 android-native/patch_android_project.py android

      - name: Ensure location permissions + validate AndroidManifest.xml
        run: |
          python3 - <<'PY'
          import xml.dom.minidom as m
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf8").read()
          add = ""
          for perm in ("android.permission.ACCESS_FINE_LOCATION", "android.permission.ACCESS_COARSE_LOCATION", "android.permission.INTERNET"):
              if perm not in s:
                  add += f'\n    <uses-permission android:name="{perm}" />'
          if add:
              s = s.replace("</manifest>", add + "\n</manifest>")
              open(p, "w", encoding="utf8").write(s)
          m.parseString(s.encode("utf8"))
          print("AndroidManifest.xml is valid XML")
          PY

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jehan-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
