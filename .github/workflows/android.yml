name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java (Capacitor 7 needs JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi

      - name: JS syntax check
        run: npm run check

      - name: Download exact page map (604 pages) into data/
        run: |
          URL=https://raw.githubusercontent.com/Mushaf-Learning/quran-text/main/metadata/pages.json
          if curl -L --fail --retry 4 --retry-delay 5 -o data/page-map.json "$URL"; then
            python3 - <<'PY'
          import json, sys
          m = json.load(open("data/page-map.json", encoding="utf-8"))
          ok = isinstance(m, list) and len(m) == 604 and all({"page", "sura", "aya"} <= set(x) for x in m)
          print("page-map valid:", ok)
          sys.exit(0 if ok else 1)
          PY
          else
            false
          fi || { rm -f data/page-map.json; echo "::warning::page-map.json not available; app will use the estimated page mapping"; }

      - name: Prepare www (web files + ONNX runtime + model)
        run: |
          rm -rf www && mkdir -p www/vendor/ort www/models
          cp -r index.html sw.js manifest.webmanifest css js data icons mushaf assets www/
          # ONNX Runtime Web: ort.min.js next to index.html, wasm/mjs in vendor/ort/
          cp node_modules/onnxruntime-web/dist/ort.min.js www/vendor/ort.min.js
          find node_modules/onnxruntime-web/dist -maxdepth 1 \( -name 'ort*.wasm' -o -name 'ort*.mjs' \) -exec cp {} www/vendor/ort/ \;
          # FastConformer model + CTC tokens (downloaded at build time, bundled into the APK)
          BASE=https://huggingface.co/acibZ/tilawa-quran-onnx/resolve/main
          curl -L --fail --retry 4 --retry-delay 5 -o www/models/fastconformer_full_mixed.onnx "$BASE/fastconformer_full_mixed.onnx"
          curl -L --fail --retry 4 --retry-delay 5 -o www/models/quran_ctc_tokens.json "$BASE/quran_ctc_tokens.json"

      - name: Sanity checks
        run: |
          pages=$(ls www/mushaf/pages/page-*.jpg | wc -l)
          echo "mushaf pages: $pages"; test "$pages" -eq 604
          test -s www/data/quran.json
          test -s native-res/raw/adhan.mp3
          test -s native-res/raw/salawat.mp3
          test "$(stat -c %s www/models/fastconformer_full_mixed.onnx)" -gt 50000000
          test -s www/vendor/ort.min.js
          ls www/vendor/ort

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      - name: Patch Android project (Java, res, manifest, MainActivity)
        run: python3 android-native/patch_android_project.py

      - name: Add location permissions to manifest
        run: |
          python3 - <<'PY'
          import re
          from xml.dom import minidom
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf8").read()
          add = ""
          for perm in ("android.permission.ACCESS_COARSE_LOCATION", "android.permission.ACCESS_FINE_LOCATION"):
              if perm not in s:
                  add += f'\n    <uses-permission android:name="{perm}" />'
          if add:
              s = s.replace("</manifest>", add + "\n</manifest>")
              open(p, "w", encoding="utf8").write(s)
          minidom.parseString(s.encode("utf8"))  # fails the build if the manifest is broken
          print("manifest OK")
          PY

      - name: Generate launcher icons from icons/icon-512.png
        run: |
          pip install pillow
          python3 - <<'PY'
          import os, glob
          from PIL import Image, ImageDraw
          res = "android/app/src/main/res"
          src = Image.open("icons/icon-512.png").convert("RGBA")
          for d in glob.glob(res + "/mipmap-anydpi-v26"):
              for f in glob.glob(d + "/ic_launcher*.xml"):
                  os.remove(f)   # drop Capacitor's default adaptive icon so our PNGs are used
          for dpi, px in {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}.items():
              d = f"{res}/mipmap-{dpi}"
              os.makedirs(d, exist_ok=True)
              im = src.resize((px, px), Image.LANCZOS)
              im.save(f"{d}/ic_launcher.png")
              im.save(f"{d}/ic_launcher_foreground.png")
              mask = Image.new("L", (px, px), 0)
              ImageDraw.Draw(mask).ellipse((0, 0, px - 1, px - 1), fill=255)
              rnd = im.copy(); rnd.putalpha(mask); rnd.save(f"{d}/ic_launcher_round.png")
          print("launcher icons OK")
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tasneem-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
